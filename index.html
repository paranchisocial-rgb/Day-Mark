.list.li{padding:2px 14px}

.li .r.dg b,.li .r.dg>span:first-child{color:var(--neg)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--hb);border-top:var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:18}

.ov{position:fixed;inset:0;background:rgba(12,9,4,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.ov.c{align-items:center;padding:20px}.ov.c .sh{border-radius:24px}
.sh{width:100%;max-width:560px;background:var(--card);border-radius:26px 26px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 18px);animation:slide .28s ease;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain}

@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateY(100%)}}@keyframes pop{from{transform:scale(.94);opacity:0}}
.grab{width:38px;height:4px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sht{font:700 19px var(--fs);letter-spacing:-.3px;margin:0 0 4px}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.rn{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:11px 12px;margin-top:16px;font-size:13px;color:var(--mute)}.rn span{flex:1}.rn button{background:none;border:0;color:var(--a);font-weight:600;padding:0}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.chk{position:relative}.chk::after{content:"";position:absolute;inset:-10px}
.task:focus-visible{outline:2px solid var(--a);outline-offset:-2px;border-radius:12px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.jb{white-space:pre-wrap;word-break:break-word;background-color:var(--bg);border:var(--bd);border-left:3px solid var(--a);border-radius:6px 16px 16px 6px;padding:14px 16px}

<script>
/* ===== Storage ===== */
const LS='discipline_v1';
let S={tasks:{},journal:{},mood:{},theme:'light',routines:[],rg:{}};
let _raw=null;try{_raw=localStorage.getItem(LS);Object.assign(S,JSON.parse(_raw)||{})}catch(e){if(_raw)try{localStorage.setItem(LS+'_rescue',_raw)}catch(x){}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
['tasks','journal','mood','rg'].forEach(k=>{if(!S[k]||typeof S[k]!='object'||Array.isArray(S[k]))S[k]={}});if(!Array.isArray(S.routines))S.routines=[];
if(S.v!==2&&S.v!==3){S.theme=({country:'dark',mughal:'light',dark:'minimal'})[S.theme]||'light';S.v=2}
if(S.v<3)S.v=3; /* v3 adds routines + rg (log of generated routine days) */
/* save() is debounced: many edits in a row cost one write. flush() writes now (also runs when the app is hidden). */
let _dirty=0,_st=0,_sc={},_sk=null,_gs='',_ver=0; /* _ver changes whenever data changes (Stats cache key) */
const save=()=>{_dirty=1;_sc={};_sk=null;_ver++;clearTimeout(_st);_st=setTimeout(flush,300)};
function flush(){clearTimeout(_st);if(!_dirty)return;_dirty=0;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Could not save: storage full. Export a backup')}}

/* ===== Helpers ===== */
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const parse=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let TODAY=key(new Date());
const stat=k=>_sc[k]||(_sc[k]=(a=>{const c=a.filter(x=>x.d).length;return{n:a.length,c,p:a.length?Math.round(c/a.length*100):null}})(S.tasks[k]||[]));
const fmtLong=k=>parse(k).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
const shift=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return key(d)};
const words=t=>(t.trim().match(/\S+/g)||[]).length;
const okD=k=>/^\d{4}-\d\d-\d\d$/.test(k)&&key(parse(k))===k; /* real calendar date, not just the right shape */
let view='home',cur=TODAY,calM=new Date(),calSel=TODAY,range='month',sh={};

/* ===== Routines ===== */
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],ORD=[1,2,3,4,5,6,0],ALL=[0,1,2,3,4,5,6];
const sid=x=>/^[\w-]{1,24}$/.test(x||'')?x:uid();
const dsum=r=>r.days.length==7?'Every day':ORD.filter(d=>r.days.includes(d)).map(d=>DN[d]).join(', ');
/* adds routine tasks to day k once (S.rg remembers), never touches existing tasks */
function genDay(k,w){let ch=0;if(w==null)w=parse(k).getDay();S.routines.forEach(r=>{if(k<r.from||!r.days.includes(w))return;const g=S.rg[k]=S.rg[k]||[];if(g.includes(r.id))return;g.push(r.id);(S.tasks[k]=S.tasks[k]||[]).push({id:uid(),t:r.t,c:r.c,d:false,r:r.id});ch=1});return ch}
function genAll(){if(!S.routines.length)return;let f=S.routines.reduce((m,r)=>r.from<m?r.from:m,TODAY),ch=0;const lo=shift(TODAY,-1100);if(f<lo)f=lo;for(let d=parse(f);key(d)<=TODAY;d.setDate(d.getDate()+1))ch|=genDay(key(d),d.getDay());if(ch)save()}
function addRoutine(t,c,days,k){const r={id:uid(),t,c,days,from:k>TODAY?k:TODAY};S.routines.push(r);genDay(r.from);if(!(S.tasks[k]||[]).some(x=>x.r==r.id))(S.tasks[k]=S.tasks[k]||[]).push({id:uid(),t,c,d:false})}

let c=['M','T','W','T','F','S','S'].map(x=>`<div class="h">${x}</div>`).join('')+'<div></div>'.repeat(off),ps=[];
for(let d=1;d<=n;d++){const k=y+'-'+p2(m+1)+'-'+p2(d),s=stat(k);if(s.p!=null&&k<=TODAY)ps.push(s.p);const o=s.p==null?0:.12+s.p/100*.7;
c+=`<button class="day ${k==TODAY?'today':''} ${k==calSel?'sel':''} ${S.journal[k]?'j':''} ${o>.6?'hi':''}" style="--o:${o.toFixed(2)}" onclick="calSel='${k}';render()"><span>${d}</span><small>${s.p==null?'':s.p+'%'}</small></button>`}
const s=stat(calSel),mo=S.mood[calSel],avg=ps.length?Math.round(ps.reduce((x,z)=>x+z,0)/ps.length):null;
return `<div class="mn"><button class="sq" aria-label="Previous month" onclick="calM=new Date(${y},${m-1},1);render()">${I('left')}</button><div class="c"><h2>${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><span>${avg==null?'No data yet':'Average '+avg+'%'}</span></div><button class="sq" aria-label="Next month" onclick="calM=new Date(${y},${m+1},1);render()">${I('right')}</button></div>
${(calSel!=TODAY||y!=parse(TODAY).getFullYear()||m!=parse(TODAY).getMonth())?`<button class="tdy" onclick="calM=new Date();calSel=TODAY;render()">${I('today',18)}Jump to today</button>`:''}<div class="card"><div class="cal">${c}</div></div>
<h2 class="sec">${parse(calSel).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'})}</h2>
<div class="pair"><div class="pc"><span class="ib p">${I('ok')}</span><div><div class="lb">Done</div><div class="v">${s.c}/${s.n}</div></div></div><div class="pc"><span class="ib n">${I('stats')}</span><div><div class="lb">Score</div><div class="v">${s.p==null?'–':s.p+'%'}</div></div></div></div>
<div style="height:14px"></div>${taskList(calSel)}
<h2 class="sec">Journal</h2>
${(S.journal[calSel]||'').trim()?jRead(calSel):`<div class="card empty" style="padding:20px 10px"><p style="margin:0 0 14px">No reflection for this day.</p><button class="btn" onclick="editJ('${calSel}')">${I('pen',18)}Write reflection</button></div>`}`}

/* ===== Stats ===== */
function streaks(){const a=Object.keys(S.tasks).filter(k=>k<=TODAY).sort().map(k=>[k,stat(k).p]).filter(x=>x[1]!=null); /* days with no tasks are neutral, so skipping them gives the same result */
let best=0,run=0,c=0;a.forEach(x=>{if(x[1]>=70){run++;if(run>best)best=run}else run=0});
for(let i=a.length-1;i>=0;i--){if(a[i][1]>=70)c++;else if(a[i][0]!=TODAY)break}
return[c,best]}
const hb=(l,v,max,col,suf='')=>`<div class="hb"><div><span>${l}</span><b>${v}${suf}</b></div><i><u style="width:${max?Math.round(v/max*100):0}%;background:${col}"></u></i></div>`;
function Stats(){const now=new Date();
const start=range=='week'?parse(shift(TODAY,-6)):range=='month'?new Date(now.getFullYear(),now.getMonth(),1):new Date(now.getFullYear(),now.getMonth()-2,1);
const days=[];for(let d=new Date(start);key(d)<=TODAY;d.setDate(d.getDate()+1)){const k=key(d);days.push({k,...stat(k)})}
const act=days.filter(d=>d.n),tot=act.reduce((s,d)=>s+d.n,0),done=act.reduce((s,d)=>s+d.c,0),miss=act.filter(d=>d.k<TODAY).reduce((s,d)=>s+d.n-d.c,0); /* today's unfinished tasks are not missed yet */
const avg=act.length?Math.round(act.reduce((s,d)=>s+d.p,0)/act.length):0,perfect=act.filter(d=>d.p==100).length,jd=days.filter(d=>S.journal[d.k]).length;
const best=act.slice().sort((a,b)=>b.p-a.p||b.c-a.c)[0],worst=act.slice().sort((a,b)=>a.p-b.p||b.n-a.n)[0],[cs,bs]=streaks();
const W=320,H=120,bw=W/Math.max(days.length,1),ay=(H-avg/100*H).toFixed(1);
const bars=days.map((d,i)=>{const h=d.p==null?0:Math.max(3,d.p/100*H);return `<rect x="${(i*bw+bw*.14).toFixed(1)}" y="${H-h}" width="${(bw*.72).toFixed(1)}" height="${h}" rx="${Math.min(3,bw/3).toFixed(1)}" fill="${d.p>=80?'var(--a)':d.p>=50?'var(--gold)':'var(--neg)'}"><title>${d.k}: ${d.p==null?'no tasks':d.p+'%'}</title></rect>`}).join('');
/* categories */
const cm={};Object.keys(CATS).forEach(c=>cm[c]={n:0,c:0});act.forEach(d=>S.tasks[d.k].forEach(t=>{const o=cm[cat(t)];o.n++;if(t.d)o.c++}));
const cl=Object.keys(cm).filter(c=>cm[c].n).sort((a,b)=>cm[b].n-cm[a].n),C=2*Math.PI*40;let acc=0;
const seg=cl.filter(c=>cm[c].c).map(c=>{const len=cm[c].c/done*C,s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${CATS[c][2]}" stroke-width="16" stroke-dasharray="${Math.max(len-1.5,0.5).toFixed(1)} ${(C-len+1.5).toFixed(1)}" stroke-dashoffset="${(-acc).toFixed(1)}"/>`;acc+=len;return s}).join('');
/* weekday / trend / habits */
const wd=Array.from({length:7},()=>[0,0]);act.forEach(d=>{const i=(parse(d.k).getDay()+6)%7;wd[i][0]+=d.p;wd[i][1]++});
const wds=wd.map(x=>x[1]?Math.round(x[0]/x[1]):0),WL=['M','T','W','T','F','S','S'];
const tm={};act.forEach(d=>S.tasks[d.k].forEach(t=>{const n=t.t.trim().toLowerCase(),o=tm[n]=tm[n]||{t:t.t,n:0,c:0};o.n++;if(t.d)o.c++}));
const tl=Object.values(tm).filter(o=>o.n>=2).map(o=>({...o,r:Math.round(o.c/o.n*100)})).sort((a,b)=>b.r-a.r||b.n-a.n);
const mt=[2,1,0].map(i=>{const d=new Date(now.getFullYear(),now.getMonth()-i,1),pre=d.getFullYear()+'-'+p2(d.getMonth()+1),ps=Object.keys(S.tasks).filter(k=>k.startsWith(pre)&&k<=TODAY).map(k=>stat(k).p).filter(p=>p!=null);
return [d.toLocaleDateString(undefined,{month:'short'}),ps.length?Math.round(ps.reduce((a,b)=>a+b,0)/ps.length):0]});
const dn=x=>x?`${parse(x.k).toLocaleDateString(undefined,{day:'numeric',month:'short'})} · ${x.p}%`:'—';
return `<div class="seg">${[['week','7 days'],['month','This month'],['3m','3 months']].map(r=>`<button class="${range==r[0]?'on':''}" onclick="range='${r[0]}';render()">${r[1]}</button>`).join('')}</div>
<div class="pair"><div class="pc"><span class="ib p">${I('ok')}</span><div><div class="lb">Completed</div><div class="v pos">${done}</div></div></div><div class="pc"><span class="ib n">${I('clock')}</span><div><div class="lb">Missed</div><div class="v neg">${miss}</div></div></div></div>
<div class="grid2" style="margin-top:12px"><div class="card"><div class="lb">Average</div><div class="kv">${avg}%</div></div><div class="card"><div class="lb">Streak</div><div class="kv">${cs}<small> days · best ${bs}</small></div></div>
<div class="card"><div class="lb">Perfect days</div><div class="kv">${perfect}</div></div><div class="card"><div class="lb">Journal days</div><div class="kv">${jd}<small> of ${days.length}</small></div></div></div>
<h2 class="sec">Daily discipline</h2>
<div class="card"><svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="height:150px;display:block"><line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="var(--line)" stroke-dasharray="3"/><line x1="0" x2="${W}" y1="${ay}" y2="${ay}" stroke="var(--ink)" stroke-opacity=".45" stroke-dasharray="2 4"/>${bars}</svg>
<div class="row sp mute" style="margin-top:8px"><span>${days[0]?days[0].k.slice(5):''}</span><span>${TODAY.slice(5)}</span></div><div class="leg"><span style="--c:var(--a)">80%+</span><span style="--c:var(--gold)">50–79%</span><span style="--c:var(--neg)">Below 50%</span></div></div>
<h2 class="sec">Completed by category</h2>
<div class="card"><div style="position:relative;width:180px;height:180px;margin:2px auto 4px"><svg viewBox="0 0 100 100" width="180" height="180"><g transform="rotate(-90 50 50)"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--line)" stroke-width="16"/>${seg}</g></svg><div style="position:absolute;inset:0;display:grid;place-content:center;text-align:center"><div style="font:700 26px var(--fs)">${done}</div><div class="mute">tasks done</div></div></div>
<div class="leg">${cl.filter(c=>cm[c].c).map(c=>`<span style="--c:${CATS[c][2]}">${CATS[c][0]} · ${Math.round(cm[c].c/done*100)}%</span>`).join('')||'<span style="--c:var(--line)">No completed tasks yet</span>'}</div></div>
<h2 class="sec">Category breakdown</h2>
<div class="card" style="padding-top:8px">${cl.length?cl.map(c=>`<div class="hb"><div><span class="row" style="gap:10px">${tile(c,30)}${CATS[c][0]}</span><b>${cm[c].c}/${cm[c].n}</b></div><i><u style="width:${Math.round(cm[c].c/cm[c].n*100)}%;background:${CATS[c][2]}"></u></i></div>`).join(''):'<div class="mute" style="padding:14px 0">No data in this period.</div>'}</div>
<h2 class="sec">Patterns</h2>
<div class="card"><div class="lb">Strongest weekdays</div><div class="vb">${wds.map((v,i)=>`<div><u style="height:${Math.max(v,3)}%;${v==Math.max(...wds)&&v?'':'opacity:.5'}"></u>${WL[i]}</div>`).join('')}</div></div>
<div class="card"><div class="lb">Monthly trend</div><div class="vb">${mt.map(m=>`<div><span style="color:var(--ink)">${m[1]}%</span><u style="height:${Math.max(m[1],3)}%;background:var(--gold)"></u>${m[0]}</div>`).join('')}</div></div>
<div class="card list" style="padding-top:2px;padding-bottom:2px"><div class="task" style="cursor:default"><span class="tl" style="--c:var(--pos);width:38px;height:38px">${I('trophy')}</span><div class="tx"><b>Best day</b></div><b class="pos">${dn(best)}</b></div><div class="task" style="cursor:default"><span class="tl" style="--c:var(--neg);width:38px;height:38px">${I('warn')}</span><div class="tx"><b>Toughest day</b></div><b class="neg">${dn(worst)}</b></div></div>
<div class="card"><div class="lb">Habit consistency</div>${tl.length?tl.slice(0,6).map(o=>hb(esc(o.t),o.r,100,o.r>=70?'var(--a)':o.r>=40?'var(--gold)':'var(--neg)','%')).join(''):'<div class="mute" style="margin-top:10px">Repeat a task on several days to see its consistency.</div>'}</div>`}

let _stc=null;
function StatsC(){const k=range+'|'+_ver+'|'+TODAY;if(_stc&&_stc.k==k)return _stc.h;const h=Stats();_stc={k,h};return h} /* Stats is rebuilt only when data, range or day changed */

/* ===== Settings ===== */
const row=(ic,t,s,fn,cls='')=>`<button class="r ${cls}" ${fn?`onclick="${fn}"`:'style="cursor:default"'}><span>${I(ic,24)}</span><div><b>${t}</b><small>${s}</small></div>${fn?`<span>${I('right',18)}</span>`:''}</button>`;
function Settings(){flush();const st=((()=>{try{return localStorage.getItem(LS)||''}catch(e){return ''}})().length/1024).toFixed(1),n=Object.values(S.tasks).reduce((a,b)=>a+b.length,0)+Object.keys(S.journal).length;
return `<h2 class="sec" style="margin-top:6px">Appearance</h2>
<div class="card"><div class="lb">Theme</div><div class="seg3">${TH.map(t=>`<button class="${S.theme==t[0]?'on':''}" onclick="S.theme='${t[0]}';save();render()">${I(t[2],22)}${t[1]}</button>`).join('')}</div></div>
<h2 class="sec">Routines</h2>
<div class="card list li">${S.routines.map(r=>row(CATS[cat(r)][1],esc(r.t),dsum(r),`sheetRoutine('${r.id}')`)).join('')}${row('plus','Add routine','Repeats daily or on chosen days','sheetRoutine()')}</div>
<h2 class="sec">Data</h2>
<div class="card list li">${row('dl','Export data','Save everything as CSV','exportCSV()')}${row('ul','Import data','Restore or merge from CSV',"$('#imp').click()")}${row('db','Storage used',st+' KB · '+n+' items'+(st>3500?' · almost full, export a backup':''),'')}${row('trash','Erase all data','This cannot be undone','sheetReset()','dg')}<input type="file" id="imp" accept=".csv,text/csv" hidden onchange="importCSV(this.files[0])"></div>
<h2 class="sec">Privacy</h2>
<div class="card"><div class="row" style="align-items:flex-start;gap:14px"><span style="color:var(--a)">${I('lock',22)}</span><div><b style="font-size:15px;font-weight:500">Your data stays on this device</b><p class="mute" style="line-height:1.6;margin:8px 0 0">Everything is stored in this browser's local storage. There is no account, cloud, server or tracking, and the app works fully offline. Clearing browser data or changing device will lose it, so export a CSV backup regularly.</p></div></div></div>`}

/* ===== CSV ===== */
const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
function exportCSV(){const L=['type,date,id,done,text,category,routine'];
Object.keys(S.tasks).sort().forEach(k=>S.tasks[k].forEach(t=>L.push(['task',k,t.id,t.d?1:0,q(t.t),cat(t),t.r||''].join(','))));
Object.keys(S.journal).sort().forEach(k=>L.push(['journal',k,'','',q(S.journal[k]),''].join(',')));
Object.keys(S.mood).sort().forEach(k=>L.push(['mood',k,'','',q(S.mood[k]),''].join(',')));
S.routines.forEach(r=>L.push(['routine',r.from,r.id,r.days.map(d=>DN[d]).join('|'),q(r.t),r.c,''].join(',')));
L.push(['setting','','','',q(S.theme),''].join(','));
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+L.join('\n')],{type:'text/csv'}));a.download='daymark-backup-'+TODAY+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Backup exported')}
function parseCSV(t){const rows=[];let r=[],f='',inQ=false;for(let i=0;i<t.length;i++){const c=t[i];
if(inQ){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else inQ=false}else f+=c}
else if(c=='"')inQ=true;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}
if(f||r.length){r.push(f);rows.push(r)}return rows}
function importCSV(file){if(!file)return;const fr=new FileReader();fr.onload=()=>{let rows;try{
rows=parseCSV(String(fr.result).replace(/^\uFEFF/,'')).filter(r=>r.length>=5&&r[0]!='type');if(!rows.some(r=>['task','journal','mood','routine'].includes(r[0])))throw 0}catch(e){return toast('Not a valid backup CSV')}
window._rows=rows;modal(`<h3 class="sht">Import ${rows.length} records?</h3><p class="mute" style="line-height:1.5">Days in the file will replace the same days on this device. Other days are kept.</p><div class="row" style="margin-top:20px"><button class="btn o" style="flex:1" onclick="closeM()">Cancel</button><button class="btn" style="flex:1" onclick="doImport()">Import</button></div>`,1)};fr.readAsText(file);$('#imp').value=''}
function doImport(){const seen={},D={test:okD};_rows.forEach(([ty,d,id,dn,tx,cc,rid])=>{tx=String(tx||'');if(ty=='task'||ty=='routine')tx=tx.trim().slice(0,120);
if(ty=='task'&&D.test(d)){if(!seen[d]){S.tasks[d]=[];seen[d]=1}if(tx){const o={id:sid(id),t:tx,c:CATS[cc]?cc:'other',d:dn=='1'};if(/^[\w-]{1,24}$/.test(rid||''))o.r=rid;S.tasks[d].push(o)}}
else if(ty=='routine'){const days=[...new Set(String(dn).split('|').map(x=>DN.indexOf(x)).filter(x=>x>=0))],i=sid(id);if(tx&&days.length){S.routines=S.routines.filter(x=>x.id!=i);S.routines.push({id:i,t:tx,c:CATS[cc]?cc:'other',days,from:TODAY})}}
else if(ty=='journal'&&D.test(d)){if(tx.trim())S.journal[d]=tx}
else if(ty=='mood'&&D.test(d)&&[1,2,3,4,5].includes(+tx))S.mood[d]=+tx;
else if(ty=='setting'&&TH.some(x=>x[0]==tx))S.theme=tx});
Object.keys(seen).forEach(d=>{if(!S.tasks[d].length)delete S.tasks[d];S.rg[d]=S.routines.map(r=>r.id)});
window._rows=null;genAll();save();closeM();render();toast('Import complete')}
/* ===== Reset ===== */
function sheetReset(){modal(`<h3 class="sht" style="color:var(--neg)">Erase all data?</h3><p class="mute" style="line-height:1.5;margin:8px 0 16px">This permanently deletes every task, journal entry, mood and setting on this device. Export a backup first if you might need it.</p><input class="in" id="rs" placeholder="Type DELETE to confirm" autocapitalize="characters" oninput="$('#rb').disabled=this.value!=='DELETE'"><div class="row" style="margin-top:18px"><button class="btn o" style="flex:1" onclick="closeM()">Cancel</button><button class="btn dn" style="flex:1" id="rb" disabled onclick="doReset()">Erase everything</button></div>`,1)}
function doReset(){_dirty=0;clearTimeout(_st);_sc={};_sk=null;_ver++;dropDraft();jed=null;try{localStorage.removeItem(LS);localStorage.removeItem(LS+'_rescue')}catch(e){}S={tasks:{},journal:{},mood:{},theme:'light',routines:[],rg:{},v:3};cur=calSel=TODAY;closeM();render();toast('All data erased')}

/* ===== Back button =====
   Order: clear typed text -> close sheet -> leave typing field -> go Home -> press twice on Home to exit.
   A history entry is also pushed on the first touch, because browsers skip entries added with no user interaction. */
let _bk=0,_ex=0,_g=0;
history.replaceState({b:0},'');history.pushState({b:1},'');
const arm=()=>{if(_g)return;_g=1;history.pushState({b:1},'')};
['pointerdown','keydown'].forEach(t=>addEventListener(t,arm,{once:true,capture:true}));
window.addEventListener('popstate',()=>{
 if(_ex){history.back();return}
 const el=document.activeElement,typing=el&&(el.tagName=='INPUT'&&el.type!='file'||el.tagName=='TEXTAREA'),md=$('#md').firstChild;
 let keep=true;
 if(typing&&!el.dataset.keep&&el.value){el.value='';el.dispatchEvent(new Event('input'));$('#rb')&&($('#rb').disabled=true)}
 else if(md)closeM();
 else if(typing)el.blur();
 else if(view!='home')go('home');
 else if(Date.now()-_bk<2000)keep=false;
 else{_bk=Date.now();toast('Press back again to exit')}
 if(keep)history.pushState({b:1},'');
 else{_ex=1;try{window.close()}catch(e){}history.back()}
});

/* ===== Long press on a task row -> edit/delete sheet ===== */
let _lp=null,_lx=0,_ly=0;
const lpx=()=>{if(!_lp)return;clearTimeout(_lp);_lp=null;document.querySelectorAll('.task.pr').forEach(x=>x.classList.remove('pr'))};
document.addEventListener('pointerdown',e=>{const r=e.target.closest('.task[data-id]');if(!r||e.target.closest('.chk'))return;_lx=e.clientX;_ly=e.clientY;r.classList.add('pr');
 _lp=setTimeout(()=>{_lp=null;r.classList.remove('pr');try{navigator.vibrate&&navigator.vibrate(18)}catch(x){}sheetTask(r.dataset.k,r.dataset.id)},480)});
document.addEventListener('pointermove',e=>{if(_lp&&(Math.abs(e.clientX-_lx)>10||Math.abs(e.clientY-_ly)>10))lpx()});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,lpx));
document.addEventListener('scroll',lpx,{capture:true,passive:true});
/* real-app feel: no selection, copy/cut, drag or context menu outside typing fields */
const _ed=e=>{const n=e.target&&(e.target.nodeType==1?e.target:e.target.parentElement);return n&&n.closest&&n.closest('input,textarea')};
['contextmenu','selectstart','copy','cut','dragstart'].forEach(t=>document.addEventListener(t,e=>{if(!_ed(e))e.preventDefault()}));

function refreshToday(){const n=key(new Date());if(n==TODAY){if(sub()!=_gs)put('#top',topHTML());return}const o=TODAY;_sk=null;_sc={};TODAY=n;if(cur==o)cur=n;if(calSel==o)calSel=n;calM=new Date();genAll();render()}
document.addEventListener('visibilitychange',()=>{if(document.hidden){flush();flushDraft()}else refreshToday()});addEventListener('pagehide',()=>{flush();flushDraft()});setInterval(()=>{if(!document.hidden)refreshToday()},60000);

if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

$('#app').classList.add('an');setTimeout(()=>$('#app').classList.remove('an'),450);
genAll();render();
setTimeout(()=>{const p=$('#sp');if(p){p.classList.add('h');setTimeout(()=>p.remove(),350)}},450); /* splash */
</script>
